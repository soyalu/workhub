name: One-shot M1.6 character scene asset
on:
  push:
    branches: ["feature/m1-6-visual-polish"]
    paths: [".github/workflows/m16-traveler-asset.yml"]
permissions:
  contents: write
jobs:
  create-scene:
    if: github.repository == 'soyalu/workhub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image builder
        run: pip install 'Pillow==11.3.0'
      - name: Build single opaque character scene
        run: python scripts/build-traveler-scene.py
      - name: Commit official bitmap to this development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/art/backgrounds/traveler-scene.webp
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "art(m16): commit opaque background character scene"
            git push origin "HEAD:feature/m1-6-visual-polish"
          fi
