name: WorkHub CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: React build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # M1 bootstrap has no lock file yet. Switch to npm ci after committing it.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck -w @workhub/frontend
      - name: Production build
        run: npm run build -w @workhub/frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance and screenshots
        run: npm run test:e2e -w @workhub/frontend
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workhub-m1-e2e
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  backend:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Go formatting
        run: |
          unformatted="$(gofmt -l backend)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go -C backend vet ./...
      - name: Unit tests
        run: go -C backend test -race ./...
      - name: Build
        run: go -C backend build ./...
