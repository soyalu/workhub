name: Bootstrap M1.7 lockfile
on:
  push:
    branches: ["feature/m1-7-motion-prototype"]
    paths: [".github/workflows/m17-lock.yml"]
permissions:
  contents: write
jobs:
  create-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency lock to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(m17): lock Motion and PixiJS dependencies"
            git push origin HEAD:feature/m1-7-motion-prototype
          fi
