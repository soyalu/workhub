name: One-shot dependency lock generation
on:
  push:
    branches: ["feature/m1-ui-foundation"]
    paths: [".github/workflows/bootstrap-lock.yml"]
permissions:
  contents: write
jobs:
  generate-lock:
    if: github.repository == 'soyalu/workhub'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible frontend dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
          else
            git commit -m "chore(deps): commit generated npm lockfile"
            git push origin "HEAD:feature/m1-ui-foundation"
          fi
